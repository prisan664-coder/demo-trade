<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MiTrade</title>
    <link rel="stylesheet" href="index-style.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* พื้นหลังบนคอมพิวเตอร์ให้อารมณ์ Clean Dark Studio */
        html,
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        /* โครงสร้างจำลองกรอบมือถือ (Mobile Phone Frame) */
        .mobile-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 844px;
            /* ความสูงมาตรฐานสมาร์ทโฟน ไม่ให้ยาวเกินไปบนคอม */
            background-color: #f8fafc;
            color: #1e293b;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 36px;
            /* ขอบมนจำลองจอมือถือ */
            border: 8px solid #1e293b;
        }

        /* Header ดีไซน์แบบ Glassmorphism */
        header {
            background: rgba(24, 119, 242, 0.95);
            backdrop-filter: blur(10px);
            color: #ffffff;
            text-align: center;
            padding: 16px 12px;
            box-shadow: 0 2px 10px rgba(24, 119, 242, 0.2);
            z-index: 10;
        }

        header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* เมนูนำทางแบบ Mobile Navbar */
        nav {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            z-index: 9;
        }

        nav ul {
            display: flex;
            justify-content: space-around;
            list-style: none;
            padding: 10px 6px;
        }

        nav ul li a {
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            font-size: 0.82rem;
            padding: 8px 14px;
            border-radius: 18px;
            display: inline-block;
            transition: all 0.2s ease;
        }

        nav ul li a:active {
            background-color: #eff6ff;
            color: #1877f2;
        }

        /* พื้นที่แสดงเนื้อหาหลัก เลื่อนสกอร์ลได้ในกรอบ */
        main {
            padding: 14px;
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* ซ่อนแถบ Scrollbar ให้ดูสะอาดตา */
        main::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        section {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            min-height: 100px;
        }

        h2 {
            font-size: 1rem;
            color: #1877f2;
            margin-bottom: 10px;
        }

        p {
            font-size: 0.88rem;
            margin-bottom: 10px;
            color: #475569;
            line-height: 1.5;
        }

        /* รูปภาพรับกับขนาดหน้าจอมือถือ */
        .image-box {
            width: 100%;
            margin: 12px 0;
            text-align: center;
        }

        .image-box img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            display: block;
        }

        /* ปุ่มกดขนาดมาตรฐานแอปพลิเคชัน */
        .button-wrapper {
            display: flex;
            justify-content: center;
            margin: 14px 0;
        }

        .read-online-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: #1877f2;
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 22px;
            font-weight: 600;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(24, 119, 242, 0.25);
            transition: transform 0.1s ease;
        }

        .read-online-btn:active {
            transform: scale(0.98);
            background: #166fe5;
        }

        /* Footer ท้ายแอปพลิเคชัน */
        footer {
            text-align: center;
            padding: 14px 10px;
            font-size: 0.75rem;
            color: #ffffff;
            background: #1877f2;
            border-top: 1px solid #e2e8f0;
        }

        footer p {
            color: #ffffff;
            text-align: center;
            margin-bottom: 2px;
            opacity: 0.9;
        }

        /* ปรับแต่งพิเศษสำหรับหน้าจอมือถือจริง */
        @media (max-width: 480px) {

            html,
            body {
                padding: 0;
                background: #f8fafc;
            }

            .mobile-container {
                max-width: 100%;
                height: 100vh;
                max-height: 100vh;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <!-- กล่องครอบจำลองหน้าจอมือถือ -->
    <div class="mobile-container">

        <header>
            <h1>MiTrade</h1>
        </header>

        <nav>
            <ul>
                <li><a href="home.html">🏠 Home</a></li>
                <li><a href="history.html" class="active">📜 History</a></li>
                <li><a href="index.html">ℹ️ Admin</a></li>
                <li><a href="profile.html">⚙️ profile</a></li>
            </ul>
        </nav>

        <main>
            <section>
                <!-- ใส่เนื้อหา HTML ตรงนี้ -->
            </section>
        </main>

        <footer>
            <p>&copy; 2026 สงวนลิขสิทธิ์</p>
            <p>version 1.1: Mitrade</p>
            <p>WhatsApp: 020xxxxxxxx</p>
        </footer>

    </div>

    <!-- ลิงก์ดึงไฟล์ป้องกันการเปิดดูโค้ด -->
    <script src="keep-protect.js"></script>

</body>

<script = src="keep-protect.js" ></script>

</html>
